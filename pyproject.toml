[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-model"
version = "0.1.0"
description = "Educational equity factor model: time-series factor regressions, characteristic sorts, Fama-MacBeth, a fundamental factor risk model, constrained optimisation and risk attribution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "cvxpy>=1.5",
    "clarabel>=0.7",
    "scs>=3.2",
]

# NOTE: the companion `backtester` package (project 02) is a LOCAL package that is not
# published on PyPI.  It is deliberately NOT declared here, because an unpinned name could
# resolve to an unrelated PyPI project.  Install it from your local checkout instead:
#   uv pip install <path-to-your-Backtester-folder>
[project.optional-dependencies]
market = ["yfinance>=0.2.40", "requests>=2.31"]
ref = ["linearmodels>=6.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
factors = "factors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer integration tests (deselect with -m 'not slow')",
    "backtester: needs the local backtester package",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:linearmodels.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
files = ["src/factors"]

[tool.coverage.run]
source = ["factors"]
omit = ["*/cli.py"]
